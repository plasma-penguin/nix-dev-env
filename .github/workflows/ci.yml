name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Serialize main publishing without restricting independent pull-request runs.
  group: ${{ github.event_name == 'push' && 'main-write-and-publish' || github.run_id }}
  queue: max

jobs:
  linux:
    name: Linux checks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Optional authenticated Cachix access is disabled for now.
      # - name: Connect to Cachix
      #   if: ${{ secrets.CACHIX_CACHE != '' && secrets.CACHIX_AUTH_TOKEN != '' }}
      #   uses: cachix/cachix-action@v14
      #   with:
      #     name: ${{ secrets.CACHIX_CACHE }}
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake checks
        run: nix flake check

      - name: Install default package
        run: nix profile add .#default

      - name: Smoke test nix shell
        run: nix shell . -c bash -lc 'command -v git && command -v go && command -v node'

      - name: Smoke test nix develop
        run: nix develop . -c bash -lc 'command -v gopls && command -v python && command -v shellcheck'

      - name: Build Dockerfile image
        run: docker build --provenance=false -t dockerfile-built-nix-dev-env .

      - name: Smoke test Dockerfile image
        run: docker run --rm dockerfile-built-nix-dev-env bash -lc 'test "$(id -un)" = nonroot && test "$HOME" = /home/nonroot && test -w /app && command -v git && command -v tini && tmux -L nix-dev-env-smoke new-session -d && test "$(tmux -L nix-dev-env-smoke show-options -gv mouse)" = on && tmux -L nix-dev-env-smoke kill-server'

      - name: Cleanup Dockerfile image
        run: docker image rm dockerfile-built-nix-dev-env:latest --force || true

      - name: Build Nix scratch image
        run: nix build .#containerImage

      - name: Load Nix scratch image
        run: docker load < result

      - name: Smoke test Nix scratch image
        run: docker run --rm nix-dev-env:latest bash -lc 'test "$(id -un)" = nonroot && test "$HOME" = /home/nonroot && test -w /app && command -v git && tmux -L nix-dev-env-smoke new-session -d && test "$(tmux -L nix-dev-env-smoke show-options -gv mouse)" = on && tmux -L nix-dev-env-smoke kill-server'

      - name: Export scratch image artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
        run: docker save nix-dev-env:latest -o "scratch-image-${{ matrix.arch }}.tar"

      - name: Upload scratch image artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scratch-image-${{ matrix.arch }}
          path: scratch-image-${{ matrix.arch }}.tar
          retention-days: 1

      - name: Cleanup Nix scratch image
        run: |
          rm -f result "scratch-image-${{ matrix.arch }}.tar" || true
          docker image rm nix-dev-env:latest --force || true

      - name: Build Nix Ubuntu image
        run: nix build .#containerImageUbuntu

      - name: Load Nix Ubuntu image
        run: docker load < result

      - name: Smoke test Nix Ubuntu image
        run: docker run --rm nix-dev-env-ubuntu:latest bash -lc 'test "$(id -un)" = nonroot && test "$HOME" = /home/nonroot && test -w /app && command -v git && tmux -L nix-dev-env-smoke new-session -d && test "$(tmux -L nix-dev-env-smoke show-options -gv mouse)" = on && tmux -L nix-dev-env-smoke kill-server'

      - name: Export Ubuntu image artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
        run: docker save nix-dev-env-ubuntu:latest -o "ubuntu-image-${{ matrix.arch }}.tar"

      - name: Upload Ubuntu image artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-image-${{ matrix.arch }}
          path: ubuntu-image-${{ matrix.arch }}.tar
          retention-days: 1

      - name: Cleanup Nix Ubuntu image
        run: |
          rm -f result "ubuntu-image-${{ matrix.arch }}.tar" || true
          docker image rm nix-dev-env-ubuntu:latest ubuntu:latest --force || true

      - name: Save Nix store cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          gc-max-store-size: 3G

  sbx:
    name: Docker Sandbox checks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate template variants
        run: |
          set -euo pipefail

          for variant in codex-docker shell-docker opencode-docker; do
            docker build \
              --check \
              --build-arg "SBX_TEMPLATE_VARIANT=${variant}" \
              -f Dockerfile.sbx \
              .
          done

      - name: Build and smoke-test templates
        env:
          ARCH: ${{ matrix.arch }}
          EXPORT_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
        run: |
          set -euo pipefail

          build_template() {
            local agent="$1"
            local variant="$2"
            local image="nix-dev-env-sbx:${agent}-ci"

            docker build \
              --pull \
              --platform "linux/${ARCH}" \
              --provenance=false \
              --build-arg "SBX_TEMPLATE_VARIANT=${variant}" \
              -f Dockerfile.sbx \
              -t "$image" \
              .

            docker run --rm \
              --entrypoint /bin/bash \
              "$image" \
              -lc '
                set -euo pipefail
                test "$(id -un)" = agent
                command -v nix
                command -v docker
                test -r "$SSL_CERT_FILE"
                . /etc/profile.d/nix-dev-env-00-env.sh
                test "$SSL_CERT_FILE" = /etc/ssl/certs/ca-certificates.crt
                test "$SSL_CERT_DIR" = /etc/ssl/certs
                tmux -L nix-dev-env-smoke new-session -d
                test "$(tmux -L nix-dev-env-smoke show-options -gv mouse)" = on
                tmux -L nix-dev-env-smoke kill-server
              '

            case "$agent" in
              codex)
                docker run --rm \
                  --entrypoint /bin/bash \
                  "$image" \
                  -lc 'test "$(type -P codex)" = /usr/local/share/npm-global/bin/codex'
                ;;
              opencode)
                docker run --rm \
                  --entrypoint /bin/bash \
                  "$image" \
                  -lc 'test "$(type -P opencode)" = /usr/local/share/npm-global/bin/opencode'
                ;;
              shell)
                docker run --rm \
                  --entrypoint /bin/bash \
                  "$image" \
                  -lc '
                    test "$(type -P codex)" = /nix/var/nix/profiles/nix-dev-env/bin/codex
                    test "$(type -P opencode)" = /nix/var/nix/profiles/nix-dev-env/bin/opencode
                    command -v git
                    command -v bash
                  '
                ;;
            esac

            if [[ "$EXPORT_IMAGES" == "true" ]]; then
              docker save "$image" -o "sbx-${agent}-image-${ARCH}.tar"
            fi

            docker image rm "$image" --force
          }

          build_template codex codex-docker
          build_template shell shell-docker
          build_template opencode opencode-docker

      - name: Upload SBX image artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbx-images-${{ matrix.arch }}
          path: sbx-*-image-${{ matrix.arch }}.tar
          retention-days: 1

  macos:
    name: macOS checks
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Restore Nix store cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Optional authenticated Cachix access is disabled for now.
      # - name: Connect to Cachix
      #   if: ${{ secrets.CACHIX_CACHE != '' && secrets.CACHIX_AUTH_TOKEN != '' }}
      #   uses: cachix/cachix-action@v14
      #   with:
      #     name: ${{ secrets.CACHIX_CACHE }}
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake checks
        run: nix flake check

      - name: Install default package
        run: nix profile add .#default

      - name: Smoke test nix shell
        run: nix shell . -c bash -lc 'command -v git && command -v go && command -v node'

      - name: Smoke test nix develop
        run: nix develop . -c bash -lc 'command -v gopls && command -v python && command -v shellcheck'

      - name: Save Nix store cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          gc-max-store-size: 3G

  publish-scratch-images:
    name: Publish scratch images (${{ matrix.arch }})
    needs:
      - linux
      - macos
      - sbx
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Download scratch image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scratch-image-${{ matrix.arch }}
          path: /tmp/scratch-image

      - name: Load scratch image
        run: docker load < "/tmp/scratch-image/scratch-image-${{ matrix.arch }}.tar"

      - name: Resolve Docker Hub image name
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_REPO:-}" ]]; then
            IMAGE_NAME="$DOCKERHUB_REPO"
          else
            IMAGE_NAME="$DOCKERHUB_USERNAME/nix-dev-env"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push arch-specific scratch tags
        run: |
          set -euo pipefail
          VERSION_TAG="sha-${GITHUB_SHA}"
          docker tag nix-dev-env:latest "$IMAGE_NAME:${VERSION_TAG}-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:${VERSION_TAG}-${{ matrix.arch }}"
          docker tag nix-dev-env:latest "$IMAGE_NAME:latest-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:latest-${{ matrix.arch }}"

  publish-scratch-manifests:
    name: Publish scratch manifests
    needs: publish-scratch-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
    runs-on: ubuntu-latest
    environment: dockerhub

    steps:
      - name: Resolve Docker Hub image name
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_REPO:-}" ]]; then
            IMAGE_NAME="$DOCKERHUB_REPO"
          else
            IMAGE_NAME="$DOCKERHUB_USERNAME/nix-dev-env"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scratch manifests
        run: |
          set -euo pipefail
          VERSION_TAG="sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            -t "$IMAGE_NAME:${VERSION_TAG}" \
            "$IMAGE_NAME:${VERSION_TAG}-amd64" \
            "$IMAGE_NAME:${VERSION_TAG}-arm64"
          docker buildx imagetools create \
            -t "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:latest-amd64" \
            "$IMAGE_NAME:latest-arm64"

  publish-ubuntu-images:
    name: Publish Ubuntu images (${{ matrix.arch }})
    needs:
      - linux
      - macos
      - sbx
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Download Ubuntu image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ubuntu-image-${{ matrix.arch }}
          path: /tmp/ubuntu-image

      - name: Load Ubuntu image
        run: docker load < "/tmp/ubuntu-image/ubuntu-image-${{ matrix.arch }}.tar"

      - name: Resolve Docker Hub image name
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_REPO:-}" ]]; then
            IMAGE_NAME="$DOCKERHUB_REPO"
          else
            IMAGE_NAME="$DOCKERHUB_USERNAME/nix-dev-env"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push arch-specific Ubuntu tags
        run: |
          set -euo pipefail
          VERSION_TAG="ubuntu-sha-${GITHUB_SHA}"
          docker tag nix-dev-env-ubuntu:latest "$IMAGE_NAME:${VERSION_TAG}-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:${VERSION_TAG}-${{ matrix.arch }}"
          docker tag nix-dev-env-ubuntu:latest "$IMAGE_NAME:ubuntu-latest-${{ matrix.arch }}"
          docker push "$IMAGE_NAME:ubuntu-latest-${{ matrix.arch }}"

  publish-ubuntu-manifests:
    name: Publish Ubuntu manifests
    needs: publish-ubuntu-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
    runs-on: ubuntu-latest
    environment: dockerhub

    steps:
      - name: Resolve Docker Hub image name
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_REPO:-}" ]]; then
            IMAGE_NAME="$DOCKERHUB_REPO"
          else
            IMAGE_NAME="$DOCKERHUB_USERNAME/nix-dev-env"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Ubuntu manifests
        run: |
          set -euo pipefail
          VERSION_TAG="ubuntu-sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            -t "$IMAGE_NAME:${VERSION_TAG}" \
            "$IMAGE_NAME:${VERSION_TAG}-amd64" \
            "$IMAGE_NAME:${VERSION_TAG}-arm64"
          docker buildx imagetools create \
            -t "$IMAGE_NAME:ubuntu-latest" \
            "$IMAGE_NAME:ubuntu-latest-amd64" \
            "$IMAGE_NAME:ubuntu-latest-arm64"

  publish-sbx-images:
    name: Publish SBX templates (${{ matrix.arch }})
    needs:
      - linux
      - macos
      - sbx
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Download SBX image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbx-images-${{ matrix.arch }}
          path: /tmp/sbx-images

      - name: Resolve Docker Hub image name
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_REPO:-}" ]]; then
            IMAGE_NAME="$DOCKERHUB_REPO"
          else
            IMAGE_NAME="$DOCKERHUB_USERNAME/nix-dev-env"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push arch-specific SBX tags
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          for agent in codex shell opencode; do
            docker load < "/tmp/sbx-images/sbx-${agent}-image-${ARCH}.tar"

            SOURCE_IMAGE="nix-dev-env-sbx:${agent}-ci"
            VERSION_IMAGE="$IMAGE_NAME:sbx-${agent}-sha-${GITHUB_SHA}-${ARCH}"
            LATEST_IMAGE="$IMAGE_NAME:sbx-${agent}-${ARCH}"

            docker tag "$SOURCE_IMAGE" "$VERSION_IMAGE"
            docker push "$VERSION_IMAGE"
            docker tag "$SOURCE_IMAGE" "$LATEST_IMAGE"
            docker push "$LATEST_IMAGE"
          done

  publish-sbx-manifests:
    name: Publish SBX manifests
    needs: publish-sbx-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'plasma-penguin/nix-dev-env' }}
    runs-on: ubuntu-latest
    environment: dockerhub

    steps:
      - name: Resolve Docker Hub image name
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "${DOCKERHUB_REPO:-}" ]]; then
            IMAGE_NAME="$DOCKERHUB_REPO"
          else
            IMAGE_NAME="$DOCKERHUB_USERNAME/nix-dev-env"
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push multi-architecture SBX manifests
        run: |
          set -euo pipefail

          for agent in codex shell opencode; do
            VERSION_TAG="sbx-${agent}-sha-${GITHUB_SHA}"
            docker buildx imagetools create \
              -t "$IMAGE_NAME:${VERSION_TAG}" \
              "$IMAGE_NAME:${VERSION_TAG}-amd64" \
              "$IMAGE_NAME:${VERSION_TAG}-arm64"
            docker buildx imagetools create \
              -t "$IMAGE_NAME:sbx-${agent}" \
              "$IMAGE_NAME:sbx-${agent}-amd64" \
              "$IMAGE_NAME:sbx-${agent}-arm64"
          done
